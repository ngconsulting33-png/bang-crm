<style>
:root{
  --bg:#f2f1ed;--surface:#fff;--surface2:#f7f6f2;--surface3:#eeecea;
  --border:#e0ddd6;--border2:#eae8e3;
  --text:#1a1814;--text2:#6b6760;--text3:#aaa49e;
  --accent:#1c3a5e;--accent2:#2b5080;--accent-lt:#e8eef5;
  --green:#1a7a4a;--green-lt:#e8f5ee;
  --orange:#c06020;--orange-lt:#fef0e6;
  --red:#b03030;--red-lt:#fdeaea;
  --gold:#b08030;--gold-lt:#fdf4e7;
  --shopify-c:#4a7010;--shopify-bg:#f0f7e0;--shopify-b:#c0d880;
  --wix-c:#0c6ebd;--wix-bg:#e4f0fb;--wix-b:#90c4e8;
  --r:12px;--rs:8px;
  --sh:0 2px 12px rgba(0,0,0,0.07);--sh2:0 8px 32px rgba(0,0,0,0.12);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;overflow:hidden;}
.sidebar{width:252px;background:var(--accent);display:flex;flex-direction:column;flex-shrink:0;}
.sb-logo{padding:24px 22px 18px;border-bottom:1px solid rgba(255,255,255,0.1);}
.sb-name{font-family:'Playfair Display',serif;font-size:16px;color:#fff;font-weight:700;line-height:1.3;}
.sb-sub{font-size:9px;color:rgba(255,255,255,0.4);letter-spacing:2px;text-transform:uppercase;margin-top:4px;}
.sb-nav{padding:12px 10px;flex:1;overflow-y:auto;}
.nav-sec{font-size:8px;color:rgba(255,255,255,0.3);letter-spacing:2px;text-transform:uppercase;padding:12px 12px 5px;margin-top:4px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--rs);cursor:pointer;margin-bottom:2px;color:rgba(255,255,255,0.62);font-size:13px;font-weight:500;transition:all .15s;border:1px solid transparent;user-select:none;}
.nav-item:hover{background:rgba(255,255,255,0.1);color:#fff;}
.nav-item.active{background:rgba(255,255,255,0.16);color:#fff;border-color:rgba(255,255,255,0.15);}
.sb-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,0.1);}
.sync-row{display:flex;align-items:center;gap:8px;font-size:11px;color:rgba(255,255,255,0.5);margin-top:6px;}
.dot{width:7px;height:7px;border-radius:50%;background:#888;flex-shrink:0;transition:background .3s;}
.dot.ok{background:#4cde88;}
.dot.err{background:#e05555;}
.dot.busy{background:#f0a040;}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{padding:15px 26px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,0.04);}
.page-title{font-family:'Playfair Display',serif;font-size:23px;color:var(--accent);font-weight:600;}
.content{flex:1;overflow-y:auto;padding:22px 26px;}
.btn{padding:8px 16px;border-radius:var(--rs);border:none;cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;font-size:12.5px;transition:all .15s;display:inline-flex;align-items:center;gap:6px;}
.btn-p{background:var(--accent);color:#fff;}.btn-p:hover{background:var(--accent2);}
.btn-s{background:var(--surface3);color:var(--text2);border:1px solid var(--border);}.btn-s:hover{background:var(--border);}
.btn-d{background:var(--red-lt);color:var(--red);border:1px solid #f0c8c8;}
.btn-g{background:var(--green-lt);color:var(--green);border:1px solid #b8e0cc;}
.btn-o{background:var(--gold-lt);color:var(--gold);border:1px solid #e8d4a0;}
.btn-cal{background:#e8f0ff;color:#3366cc;border:1px solid #b8ccf0;}
.btn-sm{padding:4px 11px;font-size:11px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:var(--sh);}
.card-title{font-family:'Playfair Display',serif;font-size:15px;color:var(--accent);font-weight:600;margin-bottom:14px;}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);border-top:3px solid var(--accent);}
.stat-val{font-family:'Playfair Display',serif;font-size:26px;color:var(--accent);line-height:1;margin-bottom:3px;margin-top:8px;}
.stat-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;}
.stat-sub{margin-top:6px;font-size:11px;color:var(--text3);}
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{text-align:left;padding:9px 13px;font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1.2px;border-bottom:2px solid var(--border);white-space:nowrap;background:var(--surface2);}
td{padding:11px 13px;border-bottom:1px solid var(--border2);font-size:13px;vertical-align:middle;}
tr:hover td{background:var(--surface2);}
tr:last-child td{border-bottom:none;}
.toolbar{display:flex;gap:10px;margin-bottom:14px;align-items:center;flex-wrap:wrap;}
.search-input{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:8px 13px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;flex:1;min-width:180px;outline:none;box-shadow:var(--sh);}
.search-input:focus{border-color:var(--accent);}
select.fsel{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:8px 13px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;outline:none;cursor:pointer;box-shadow:var(--sh);}
.modal-bg{position:fixed;inset:0;background:rgba(20,16,10,0.45);display:flex;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(3px);}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:26px;width:560px;max-height:90vh;overflow-y:auto;box-shadow:var(--sh2);}
.modal-title{font-family:'Playfair Display',serif;font-size:19px;color:var(--accent);margin-bottom:20px;font-weight:600;}
.frow{margin-bottom:13px;}
.flabel{display:block;font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;font-weight:600;}
.finput,.fsel2,.ftxt{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:8px 13px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;width:100%;outline:none;transition:border-color .15s;}
.finput:focus,.fsel2:focus,.ftxt:focus{border-color:var(--accent);background:var(--surface);}
.ftxt{resize:vertical;min-height:68px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
.fsec{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1.2px;font-weight:700;padding:14px 0 8px;border-top:1px solid var(--border);margin-top:6px;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.four-col{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.detail{position:fixed;right:0;top:0;bottom:0;width:400px;background:var(--surface);border-left:1px solid var(--border);z-index:100;overflow-y:auto;padding:22px;box-shadow:-4px 0 20px rgba(0,0,0,0.09);}
.d-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.d-field{border-bottom:1px solid var(--border2);padding:10px 0;}
.d-label{font-size:9.5px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px;font-weight:700;}
.d-val{font-size:13px;}
.kanban{display:flex;gap:13px;overflow-x:auto;padding-bottom:12px;}
.k-col{min-width:200px;flex:1;}
.k-hdr{display:flex;align-items:center;gap:7px;margin-bottom:9px;}
.k-dot{width:9px;height:9px;border-radius:50%;}
.k-label{font-weight:600;font-size:12px;color:var(--text2);}
.k-total{margin-left:auto;font-size:10.5px;color:var(--text3);}
.deal-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:13px;margin-bottom:9px;border-left-width:3px;transition:all .12s;box-shadow:var(--sh);}
.deal-card:hover{transform:translateY(-2px);box-shadow:var(--sh2);}
.prob-bar{height:3px;background:var(--border);border-radius:99px;margin-top:7px;}
.prob-fill{height:100%;border-radius:99px;}
.rdv-item{display:flex;gap:13px;padding:13px 0;border-bottom:1px solid var(--border2);align-items:flex-start;}
.rdv-chk{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;margin-top:3px;}
.hist-item{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--border2);}
.hist-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:5px;}
.app-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:11px;}
.app-box-name{font-weight:700;font-size:12px;margin-bottom:7px;color:var(--accent);}
.app-plan-row{display:flex;justify-content:space-between;font-size:11px;padding:2px 0;border-bottom:1px solid var(--border2);}
.app-plan-row:last-child{border-bottom:none;}
.tag-pill{display:inline-block;padding:2px 9px;background:var(--accent-lt);color:var(--accent);border-radius:99px;font-size:10.5px;margin:2px;font-weight:500;}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);color:#fff;padding:11px 22px;border-radius:99px;font-size:13px;font-weight:500;z-index:9999;box-shadow:var(--sh2);animation:tin .22s ease;}
@keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(14px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
.page{animation:fin .18s ease;}
@keyframes fin{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}
.hidden{display:none!important;}
::-webkit-scrollbar{width:5px;height:5px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;}
.prime-box{background:#fffdf0;border:2px solid #c09020;border-radius:var(--r);padding:20px;margin-bottom:16px;}
.cfg-input{background:#fff;border:1px solid var(--border);border-radius:var(--rs);padding:8px 13px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;width:100%;outline:none;}
</style>
</head>

function fmt(n){
  return new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n);
}
function fmtDate(d){
  if(!d) return '--';
  return new Date(d+'T12:00:00').toLocaleDateString('fr-FR');
}
function nextId(arr){
  if(!arr.length) return 1;
  return Math.max.apply(null, arr.map(function(x){return x.id;})) + 1;
}
var AVC = ['#1c3a5e','#2a6050','#5a3060','#6a4020','#204060','#3a4a20'];
function avColor(name){return AVC[name.charCodeAt(0) % AVC.length];}
function inits(name){return name.split(' ').map(function(p){return p[0];}).join('').slice(0,2).toUpperCase();}

function ava(name, size){
  size = size || 34;
  return '<div style="width:'+size+'px;height:'+size+'px;border-radius:50%;background:'+avColor(name)+';display:flex;align-items:center;justify-content:center;font-family:Playfair Display,serif;font-weight:700;font-size:'+(size*0.36)+'px;color:#fff;flex-shrink:0">'+inits(name)+'</div>';
}

}

}

  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){t.remove();}, 2800);
}

// SUPABASE
// ============================================================
var supa = null;
var supaOK = false;
var syncing = false;
var reloadTimer = null;

function initSupa(){
  try{
    if(typeof supabase === 'undefined') return false;
    supa = supabase.createClient(SUPA_URL, SUPA_KEY);
    supaOK = true;
    setSyncStatus('busy','Connexion...');
    return true;
  } catch(e){ supaOK = false; return false; }
}

function setSyncStatus(state, txt){
  var dot = document.getElementById('syncDot');
  var span = document.getElementById('syncTxt');
  if(!dot) return;
  dot.className = 'dot' + (state === 'ok' ? ' ok' : state === 'err' ? ' err' : ' busy');
  if(span) span.textContent = txt || '';
}

async function loadSupa(){
  if(!supa) return false;
  try{
    setSyncStatus('busy','Chargement...');
    var ag = await supa.from('agences').select('*').order('id');
    var dl = await supa.from('deals').select('*').order('id');
    var rv = await supa.from('rdvs').select('*').order('id');
    var cfg = await supa.from('config').select('*').limit(1);
    if(ag.error) throw ag.error;
    DB.agences = ag.data.map(function(r){ var d = r.data; d._sid = r.id; return d; });
    DB.deals = dl.data.map(function(r){ var d = r.data; d._sid = r.id; return d; });
    DB.rdvs = rv.data.map(function(r){ var d = r.data; d._sid = r.id; return d; });
    if(cfg.data && cfg.data.length > 0){
      var c = cfg.data[0].data;
      DB.config = c.config || DB.config;
      DB.primesDone = c.primesDone || [];
    }
    saveLocal();
    setSyncStatus('ok','Supabase connecte');
    return true;
  } catch(e){
    console.warn('Supabase load error:', e);
    setSyncStatus('err','Hors ligne (local)');
    return false;
  }
}

async function saveSupa(){
  if(!supa || syncing) return;
  syncing = true;
  setSyncStatus('busy','Sync...');
  try{
    var i, r, res;
    for(i = 0; i < DB.agences.length; i++){
      var a = DB.agences[i];
      var sid = a._sid;
      var data = {}; for(var k in a){ if(k !== '_sid') data[k] = a[k]; }
      if(sid){ await supa.from('agences').update({data:data}).eq('id',sid); }
      else{ res = await supa.from('agences').insert({data:data}).select().single(); if(res.data) a._sid = res.data.id; }
    }
    for(i = 0; i < DB.deals.length; i++){
      var d = DB.deals[i];
      var dsid = d._sid;
      var ddata = {}; for(var dk in d){ if(dk !== '_sid') ddata[dk] = d[dk]; }
      if(dsid){ await supa.from('deals').update({data:ddata}).eq('id',dsid); }
      else{ res = await supa.from('deals').insert({data:ddata}).select().single(); if(res.data) d._sid = res.data.id; }
    }
    for(i = 0; i < DB.rdvs.length; i++){
      r = DB.rdvs[i];
      var rsid = r._sid;
      var rdata = {}; for(var rk in r){ if(rk !== '_sid') rdata[rk] = r[rk]; }
      if(rsid){ await supa.from('rdvs').update({data:rdata}).eq('id',rsid); }
      else{ res = await supa.from('rdvs').insert({data:rdata}).select().single(); if(res.data) r._sid = res.data.id; }
    }
    // Save config
    var cfgPayload = {config: DB.config, primesDone: DB.primesDone};
    var existing = await supa.from('config').select('id').limit(1);
    if(existing.data && existing.data.length > 0){
      await supa.from('config').update({data:cfgPayload}).eq('id', existing.data[0].id);
    } else {
      await supa.from('config').insert({data:cfgPayload});
    }
    saveLocal();
    setSyncStatus('ok','Supabase connecte');
  } catch(e){
    console.warn('Supabase save error:', e);
    setSyncStatus('err','Erreur sync');
    toast('Erreur sync - donnees sauvees localement', false);
  }
  syncing = false;
}

function subscribeSupa(){
  if(!supa) return;
  supa.channel('bang-crm')
    .on('postgres_changes',{event:'*',schema:'public',table:'agences'},reloadDebounce)
    .on('postgres_changes',{event:'*',schema:'public',table:'deals'},reloadDebounce)
    .on('postgres_changes',{event:'*',schema:'public',table:'rdvs'},reloadDebounce)
    .subscribe(function(s){ if(s === 'SUBSCRIBED') setSyncStatus('ok','Supabase connecte'); });
}

function reloadDebounce(){
  clearTimeout(reloadTimer);
  reloadTimer = setTimeout(async function(){
    await loadSupa();
    injectPrimes();
    render();
    toast('Donnees synchronisees');
  }, 800);
}

// ============================================================
// PRIMES
// ============================================================
function computePrimes(){
  var today = new Date();
  var primes = [];
  DB.agences.forEach(function(ag){
    if(!ag.appDates) return;
    Object.keys(ag.appDates).forEach(function(appKey){
      var plans = ag.appDates[appKey];
      Object.keys(plans).forEach(function(plan){
        var dateStr = plans[plan];
        if(!dateStr) return;
        var start = new Date(dateStr);
        var months = (today.getFullYear() - start.getFullYear()) * 12 + (today.getMonth() - start.getMonth());
        var count = (ag.appSubs && ag.appSubs[appKey] && ag.appSubs[appKey][plan]) || 0;
        if(count > 0 && months >= 6){
          var key = 'prime_' + ag.id + '_' + appKey + '_' + plan;
          var done = (DB.primesDone || []).indexOf(key) >= 0;
          primes.push({agenceId:ag.id,agenceName:ag.name,appKey:appKey,appName:(APPS[appKey]?APPS[appKey].name:appKey),plan:plan,count:count,months:months,amount:getPrimeAmount()*count,key:key,done:done});
        }
      });
    });
  });
  return primes;
}

function injectPrimes(){
  var primes = computePrimes().filter(function(p){ return !p.done; });
  primes.forEach(function(p){
    var note = 'PRIME a verser : ' + p.agenceName + ' - ' + p.appName + ' Plan ' + p.plan;
    var exists = DB.rdvs.some(function(r){ return r.note === note && !r.done; });
    if(!exists){
      DB.rdvs.unshift({id:nextId(DB.rdvs),type:'Prime',agenceId:p.agenceId,contact:'',note:note,date:new Date().toISOString().slice(0,10),heure:'',done:false,exportCal:false,isPrime:true});
    }
  });
}

function markPrimeDone(key){
  if(!DB.primesDone) DB.primesDone = [];
  if(DB.primesDone.indexOf(key) < 0) DB.primesDone.push(key);
  saveAll(); render(); toast('Prime marquee comme versee');
}

function resetPrimes(){
  if(!confirm('Reinitialiser toutes les primes versees ?')) return;
  DB.primesDone = [];
  saveAll(); render(); toast('Primes reinitialisees');
}

function readAgenceForm(existing){
  var apps = [], appSubs = emptyAppSubs(), appDates = emptyAppDates();
  if(document.getElementById('ck_hs').checked){
    apps.push('hexaship');
    ['Basic','Grow','Advanced','Plus'].forEach(function(p){
      appSubs.hexaship[p] = parseInt(document.getElementById('hs_'+p).value)||0;
      appDates.hexaship[p] = document.getElementById('hs_d_'+p).value||'';
    });
  }
  if(document.getElementById('ck_sv').checked){
    apps.push('survey');
    appSubs.survey.Unique = parseInt(document.getElementById('sv_U').value)||0;
    appDates.survey.Unique = document.getElementById('sv_d').value||'';
  }
  if(document.getElementById('ck_pn').checked){
    apps.push('panier');
    appSubs.panier.Unique = parseInt(document.getElementById('pn_U').value)||0;
    appDates.panier.Unique = document.getElementById('pn_d').value||'';
  }
  return {
    name:document.getElementById('ag_n').value.trim(),
    contact:document.getElementById('ag_ct').value.trim(),
    email:document.getElementById('ag_e').value.trim(),
    phone:document.getElementById('ag_ph').value.trim(),
    platform:document.getElementById('ag_pl').value,
    status:document.getElementById('ag_st').value,
    ca:Number(document.getElementById('ag_ca').value)||0,
    employees:Number(document.getElementById('ag_em').value)||0,
    tags:document.getElementById('ag_tg').value.trim(),
    notes:document.getElementById('ag_nt').value.trim(),
    apps:apps, appSubs:appSubs, appDates:appDates,
    lastContact:existing?existing.lastContact:new Date().toISOString().slice(0,10),
    history:existing?existing.history:[]
  };
}

function saveAgence(){
  var o = readAgenceForm(null);
  if(!o.name){ alert('Nom requis'); return; }
  o.id = nextId(DB.agences);

function pgPipeline(){
  var cols = STAGES.map(function(stage){
    var sd = DB.deals.filter(function(d){ return d.stage === stage; });
    var tot = sd.reduce(function(s,d){ return s+d.value; }, 0);
    var c = STAGE_COLORS[stage];
    var cards = sd.map(function(d){
      var ag = DB.agences.find(function(a){ return a.id === d.agenceId; });
      return '<div class="deal-card" style="border-left-color:'+c+'">'+
        '<div style="font-weight:600;font-size:13px;margin-bottom:7px">'+d.title+'</div>'+
        (ag ? '<div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2);margin-bottom:8px">'+ava(ag.name,18)+'<span>'+ag.name+'</span></div>' : '')+
        (d.app ? '<div style="margin-bottom:6px">'+appBadge(d.app)+'</div>' : '')+
        '<div style="display:flex;justify-content:space-between"><span style="font-family:Playfair Display,serif;font-size:16px;color:var(--accent)">'+fmt(d.value)+'</span><span style="font-size:11px;color:var(--text3)">'+d.probability+'%</span></div>'+
        '<div class="prob-bar"><div class="prob-fill" style="width:'+d.probability+'%;background:'+c+'"></div></div>'+
        '<div style="font-size:10.5px;color:var(--text3);margin-top:5px">Cloture : '+fmtDate(d.closeDate)+'</div>'+
        '<div style="margin-top:8px;display:flex;gap:5px">'+
        '<button class="btn btn-sm btn-s" onclick="openEditDeal('+d.id+')">&#9999;</button>'+
        '<button class="btn btn-sm btn-d" onclick="deleteDeal('+d.id+')">&#10005;</button></div></div>';
    }).join('');
    return '<div class="k-col">'+
      '<div class="k-hdr"><div class="k-dot" style="background:'+c+'"></div>'+
      '<span class="k-label">'+STAGE_LABELS[stage]+'</span>'+
      '<span class="k-total">'+fmt(tot)+'</span></div>'+
      cards+'</div>';
  }).join('');

  return '<div class="page"><div style="display:flex;justify-content:flex-end;margin-bottom:14px"><button class="btn btn-p" onclick="openAddDeal()">+ Nouvelle affaire</button></div><div class="kanban">'+cols+'</div></div>';

function pgRdv(){
  var upcoming = DB.rdvs.filter(function(r){return !r.done;}).sort(function(a,b){return a.date>b.date?1:-1;});
  var done = DB.rdvs.filter(function(r){return r.done;});
  var sel = DB.rdvs.filter(function(r){return r.exportCal;}).length;

  var upRows = upcoming.length === 0 ? '<div style="text-align:center;padding:44px;color:var(--text3)">Aucun RDV a venir</div>' :
    upcoming.map(function(r){
      var ag = DB.agences.find(function(a){return a.id===r.agenceId;});
      var isPrime = r.isPrime;
      var typeBadge = '<span style="display:inline-block;padding:2px 9px;border-radius:99px;font-size:10px;background:'+(isPrime?'#fdf4e7':'var(--accent-lt)')+';color:'+(isPrime?'#8a6010':'var(--accent)')+';border:1px solid '+(isPrime?'#e0c070':'#c0d4f0')+'">'+r.type+'</span>';
      return '<div class="rdv-item">'+
        '<input type="checkbox" class="rdv-chk" '+(r.exportCal?'checked':'')+' onchange="toggleCal('+r.id+',this.checked)">'+
        '<span style="font-size:19px;margin-top:2px">&#128197;</span>'+
        '<div style="flex:1"><div style="font-size:13px;font-weight:600;margin-bottom:3px">'+r.note+'</div>'+
        '<div style="font-size:11px;color:var(--text3)">'+(ag?ag.name:'--')+' - '+r.type+' - '+fmtDate(r.date)+(r.heure?' a '+r.heure:'')+'</div></div>'+
        '<div style="display:flex;gap:6px;align-items:center;flex-shrink:0">'+typeBadge+
        '<button class="btn btn-sm btn-g" onclick="doneRdv('+r.id+')">Fait</button>'+
        '<button class="btn btn-sm btn-d" onclick="delRdv('+r.id+')">&#10005;</button></div></div>';
    }).join('');

  var doneRows = done.length === 0 ? '' :
    '<div class="card"><div class="card-title" style="color:var(--text3)">RDV passes</div>'+
    done.map(function(r){
      var ag = DB.agences.find(function(a){return a.id===r.agenceId;});
      return '<div class="rdv-item" style="opacity:.55"><span style="font-size:19px">&#9989;</span>'+
        '<div style="flex:1"><div style="font-size:13px;text-decoration:line-through">'+r.note+'</div>'+
        '<div style="font-size:11px;color:var(--text3)">'+(ag?ag.name:'--')+' - '+fmtDate(r.date)+'</div></div>'+
        '<button class="btn btn-sm btn-d" onclick="delRdv('+r.id+')">&#10005;</button></div>';
    }).join('')+'</div>';

  return '<div class="page">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px">'+
    '<div style="display:flex;gap:8px;align-items:center">'+
    '<span style="font-size:12px;color:var(--text2)">'+sel+' RDV selectionnes pour export</span>'+
    '<button class="btn btn-sm btn-cal" onclick="exportICS()">&#128198; Google Agenda</button></div>'+
    '<button class="btn btn-p" onclick="openAddRdv()">+ Nouveau RDV</button></div>'+
    '<div class="card"><div class="card-title">A venir</div>'+upRows+'</div>'+
    doneRows+'</div>';
}

function toggleCal(id, val){
  var r = DB.rdvs.find(function(x){return x.id===id;});
  if(r){ r.exportCal = val; saveRender(); }
}
function doneRdv(id){
  var r = DB.rdvs.find(function(x){return x.id===id;});
  if(r){ r.done=true; r.exportCal=false; saveRender(); toast('RDV marque comme fait'); }
}

function saveRdv(){
  var note = document.getElementById('r_no').value.trim();
  var date = document.getElementById('r_dt').value;
  if(!note||!date){ alert('Notes et date requis'); return; }
  var agId = Number(document.getElementById('r_ag').value)||null;
  DB.rdvs.unshift({id:nextId(DB.rdvs),type:document.getElementById('r_ty').value,agenceId:agId,contact:document.getElementById('r_co').value.trim(),note:note,date:date,heure:document.getElementById('r_he').value,done:false,exportCal:document.getElementById('r_cal').checked});
  if(agId){
    var ag = DB.agences.find(function(a){return a.id===agId;});
    if(ag){ if(!ag.history) ag.history=[]; ag.history.push({date:date,text:'RDV planifie : '+document.getElementById('r_ty').value+' - '+note}); ag.lastContact=date; }
  }
  closeModal(); saveRender(); toast('RDV cree');
}

// ============================================================
// EXPORT ICS
// ============================================================
function exportICS(){
  var sel = DB.rdvs.filter(function(r){ return r.exportCal && !r.done; });
  if(!sel.length){ toast('Cochez des RDV a exporter', false); return; }
  function pad(n){ return String(n).padStart(2,'0'); }
  function icsDate(d, h){
    var dt = new Date((d||'2026-01-01') + 'T' + (h||'09:00') + ':00');
    return dt.getFullYear() + pad(dt.getMonth()+1) + pad(dt.getDate()) + 'T' + pad(dt.getHours()) + pad(dt.getMinutes()) + '00';
  }
  var CRLF = '\r\n';
  var ics = 'BEGIN:VCALENDAR' + CRLF + 'VERSION:2.0' + CRLF + 'PRODID:-//BANG Solution Trading//CRM//FR' + CRLF + 'CALSCALE:GREGORIAN' + CRLF + 'METHOD:PUBLISH' + CRLF;
  sel.forEach(function(r){
    var ag = DB.agences.find(function(a){ return a.id === r.agenceId; });
    var start = icsDate(r.date, r.heure);
    var endH = r.heure ? String(Number(r.heure.split(':')[0])+1).padStart(2,'0') + ':' + r.heure.split(':')[1] : '10:00';
    var end = icsDate(r.date, endH);
    ics += 'BEGIN:VEVENT' + CRLF;
    ics += 'UID:bang-rdv-' + r.id + '-' + Date.now() + '@bang-solution-trading' + CRLF;
    ics += 'DTSTART:' + start + CRLF;
    ics += 'DTEND:' + end + CRLF;
    ics += 'SUMMARY:[' + r.type + '] ' + r.note + CRLF;
    ics += 'DESCRIPTION:Agence : ' + (ag?ag.name:'--') + ' / Contact : ' + (r.contact||'--') + CRLF;
    ics += 'END:VEVENT' + CRLF;
  });
  ics += 'END:VCALENDAR';
  var blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'BANG_RDV_Agenda.ics'; a.click();
  URL.revokeObjectURL(url);
  toast(sel.length + ' RDV exportes vers Google Agenda');
}

function importJSON(event){
  var file = event.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = async function(e){
    try{
      var d = JSON.parse(e.target.result);
      if(d.agences && d.deals){ DB = d; saveLocal(); if(supaOK) await saveSupa(); injectPrimes(); render(); toast('Donnees restaurees'); }
      else alert('Fichier invalide');
    } catch(err){ alert('Erreur JSON'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

});
